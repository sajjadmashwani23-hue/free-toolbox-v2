<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeToolBox – Free Online Tools | Fast, Private & Easy to Use</title>
    <meta name="description" content="Fast, private, and free online tools to convert, compress, generate, and format files and data directly in your browser without uploads." />
    <meta name="author" content="FreeToolBox" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FreeToolBox – Free Online Tools | Fast, Private & Easy to Use" />
    <meta property="og:description" content="Fast, private, and free online tools to convert, compress, generate, and format files and data directly in your browser without uploads." />
    <meta property="og:site_name" content="FreeToolBox" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreeToolBox – Free Online Tools" />
    <meta name="twitter:description" content="100% free, private browser-based utilities. Zero file uploads, lightning fast." />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://freetoolbox.app/" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FreeToolBox" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Inter / Geist clean system font fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Schema.org Organization & WebSite JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://freetoolbox.app/#organization",
          "name": "FreeToolBox",
          "url": "https://freetoolbox.app/",
          "logo": "https://freetoolbox.app/icon.svg",
          "description": "High performance, client-side, zero-upload private utility tools."
        },
        {
          "@type": "WebSite",
          "@id": "https://freetoolbox.app/#website",
          "url": "https://freetoolbox.app/",
          "name": "FreeToolBox",
          "description": "Free Online Tools — Fast, Private & Easy to Use",
          "publisher": {
            "@id": "https://freetoolbox.app/#organization"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans selection:bg-blue-500 selection:text-white transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
