<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Tool Chest / Wrench icon container -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Inner square container -->
    <rect width="300" height="300" rx="60" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
    
    <!-- Stylized Wrench Icon -->
    <path d="M210 90 A45 45 0 0 0 165 135 L80 220 A22 22 0 0 0 110 250 L195 165 A45 45 0 0 0 240 120 L210 120 L210 90 Z" fill="#ffffff" />
    <circle cx="95" cy="235" r="8" fill="url(#bg)" />
    <!-- Checkmark badge / Offline Ready spark -->
    <circle cx="215" cy="215" r="34" fill="#10b981" />
    <path d="M202 215 L211 224 L228 206" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
